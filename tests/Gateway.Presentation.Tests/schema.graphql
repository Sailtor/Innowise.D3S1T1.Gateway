schema {
  query: Query
}

type Query {
  metricReadings(
    skip: Int
    take: Int
    where: MetricReadingFilterInput @cost(weight: "10")
    order: [MetricReadingSortInput!] @cost(weight: "10")
  ): MetricReadingsCollectionSegment
    @listSize(
      assumedSize: 100
      slicingArguments: ["take"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["items"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  metricAggregation(input: MetricAggregationInput!): [MetricAggregationBucket!]!
    @cost(weight: "10")
  latestReadings(rooms: [String!], types: [MetricReadingType!]): [MetricReading!]!
    @cost(weight: "10")
  rooms: [RoomSummary!]! @cost(weight: "10")
  availableRooms: [String!]! @cost(weight: "10")
}

"Air quality recorded for a room."
type AirQualityReading implements MetricReading {
  "Opaque identifier of the reading."
  id: ID!
  "Location the reading came from."
  room: String!
  "Which kind of reading this is."
  type: MetricReadingType!
  "When the ingestor pulled the batch from the upstream API. Pipeline time, not observation time - the upstream API exposes no sensor timestamp."
  ingestedAt: DateTime!
  "When the processor persisted the reading. This is the field time aggregations bucket on."
  receivedAt: DateTime!
  "Carbon dioxide concentration."
  co2: Float!
  "Particulate matter under 2.5 micrometres."
  pm25: Float!
  "Relative humidity."
  humidity: Float!
}

"Information about the offset pagination."
type CollectionSegmentInfo {
  "Indicates whether more items exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more items exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
}

"Energy consumption recorded for a room."
type EnergyReading implements MetricReading {
  "Opaque identifier of the reading."
  id: ID!
  "Location the reading came from."
  room: String!
  "Which kind of reading this is."
  type: MetricReadingType!
  "When the ingestor pulled the batch from the upstream API. Pipeline time, not observation time - the upstream API exposes no sensor timestamp."
  ingestedAt: DateTime!
  "When the processor persisted the reading. This is the field time aggregations bucket on."
  receivedAt: DateTime!
  "Energy consumed, in the unit reported by the upstream API."
  energyAmount: Float!
}

type MetricAggregationBucket {
  room: String
  bucketStart: DateTime
  stats: NumericStats!
}

"A segment of a collection."
type MetricReadingsCollectionSegment {
  "Information to aid in pagination."
  pageInfo: CollectionSegmentInfo!
  "A flattened list of the items."
  items: [MetricReading]
  totalCount: Int! @cost(weight: "10")
}

"Motion detection recorded for a room."
type MotionReading implements MetricReading {
  "Opaque identifier of the reading."
  id: ID!
  "Location the reading came from."
  room: String!
  "Which kind of reading this is."
  type: MetricReadingType!
  "When the ingestor pulled the batch from the upstream API. Pipeline time, not observation time - the upstream API exposes no sensor timestamp."
  ingestedAt: DateTime!
  "When the processor persisted the reading. This is the field time aggregations bucket on."
  receivedAt: DateTime!
  "Whether motion was detected."
  isMotionDetected: Boolean!
}

type NumericStats {
  count: Int!
  min: Float
  max: Float
  average: Float
  sum: Float
}

type RoomSummary {
  room: String!
  totalReadings: Int!
  latestReading: MetricReading
  latestByType: [MetricReading!]!
}

"A single sensor reading recorded by the ingestion pipeline."
interface MetricReading {
  "Opaque identifier of the reading."
  id: ID!
  "Location the reading came from."
  room: String!
  "Which kind of reading this is."
  type: MetricReadingType!
  "When the ingestor pulled the batch from the upstream API. Pipeline time, not observation time - the upstream API exposes no sensor timestamp."
  ingestedAt: DateTime!
  "When the processor persisted the reading. This is the field time aggregations bucket on."
  receivedAt: DateTime!
}

input DateTimeOperationFilterInput {
  eq: DateTime @cost(weight: "10")
  neq: DateTime @cost(weight: "10")
  in: [DateTime] @cost(weight: "10")
  nin: [DateTime] @cost(weight: "10")
  gt: DateTime @cost(weight: "10")
  ngt: DateTime @cost(weight: "10")
  gte: DateTime @cost(weight: "10")
  ngte: DateTime @cost(weight: "10")
  lt: DateTime @cost(weight: "10")
  nlt: DateTime @cost(weight: "10")
  lte: DateTime @cost(weight: "10")
  nlte: DateTime @cost(weight: "10")
}

"Which numeric to aggregate, over what slice, grouped how."
input MetricAggregationInput {
  groupByRoom: Boolean! = false
  field: AggregationField!
  from: DateTime
  to: DateTime
  rooms: [String!]
  interval: TimeInterval
}

input MetricReadingFilterInput {
  and: [MetricReadingFilterInput!]
  or: [MetricReadingFilterInput!]
  room: StringOperationFilterInput
  type: MetricReadingTypeOperationFilterInput
  receivedAt: DateTimeOperationFilterInput
  ingestedAt: DateTimeOperationFilterInput
}

input MetricReadingSortInput {
  receivedAt: SortEnumType @cost(weight: "10")
  ingestedAt: SortEnumType @cost(weight: "10")
  room: SortEnumType @cost(weight: "10")
  type: SortEnumType @cost(weight: "10")
}

input MetricReadingTypeOperationFilterInput {
  eq: MetricReadingType @cost(weight: "10")
  neq: MetricReadingType @cost(weight: "10")
  in: [MetricReadingType!] @cost(weight: "10")
  nin: [MetricReadingType!] @cost(weight: "10")
}

input StringOperationFilterInput {
  and: [StringOperationFilterInput!]
  or: [StringOperationFilterInput!]
  eq: String @cost(weight: "10")
  neq: String @cost(weight: "10")
  contains: String @cost(weight: "20")
  ncontains: String @cost(weight: "20")
  in: [String] @cost(weight: "10")
  nin: [String] @cost(weight: "10")
  startsWith: String @cost(weight: "20")
  nstartsWith: String @cost(weight: "20")
  endsWith: String @cost(weight: "20")
  nendsWith: String @cost(weight: "20")
}

enum AggregationField {
  ENERGY_AMOUNT
  CO2
  PM25
  HUMIDITY
  MOTION_DETECTED
}

enum MetricReadingType {
  ENERGY
  AIR_QUALITY
  MOTION
}

enum SortEnumType {
  ASC
  DESC
}

enum TimeInterval {
  MINUTE
  HOUR
  DAY
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION

"The purpose of the `@listSize` directive is to either inform the static analysis about the size of returned lists (if that information is statically available), or to point the analysis to where to find that information."
directive @listSize(
  "The `assumedSize` argument can be used to statically define the maximum length of a list returned by a field."
  assumedSize: Int
  "The `slicingArguments` argument can be used to define which of the field's arguments with numeric type are slicing arguments, so that their value determines the size of the list returned by that field. It may specify a list of multiple slicing arguments."
  slicingArguments: [String!]
  "The `slicingArgumentDefaultValue` argument can be used to define a default value for a slicing argument, which is used if the argument is not present in a query."
  slicingArgumentDefaultValue: Int
  "The `sizedFields` argument can be used to define that the value of the `assumedSize` argument or of a slicing argument does not affect the size of a list returned by a field itself, but that of a list returned by one of its sub-fields."
  sizedFields: [String!]
  "The `requireOneSlicingArgument` argument can be used to inform the static analysis that it should expect that exactly one of the defined slicing arguments is present in a query. If that is not the case (i.e., if none or multiple slicing arguments are present), the static analysis may throw an error."
  requireOneSlicingArgument: Boolean = true
) on FIELD_DEFINITION
